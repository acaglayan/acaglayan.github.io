- quote: "My heroes are those who would not trade their dreams for anything."
  author: "Mustafa Kemal Atatürk"
- quote: "We need nothing except one thing: to be hardworking."
  author: "Mustafa Kemal Atatürk"
- quote: "One who stands still is, in fact, moving backward... Forward, always forward!"
  author: "Mustafa Kemal Atatürk"
- quote: "I dreamed; I identified the obstacles standing in the way of my dream. When I removed those obstacles, my dream came true by itself."
  author: "Mustafa Kemal Atatürk"
- quote: "Minds that do not think are doomed to become captives of the thoughtless."
  author: "Mustafa Kemal Atatürk"
- quote: "The traveler on his path must not be content with seeing only the horizon; he must also see and know what lies beyond it."
  author: "Mustafa Kemal Atatürk"
- quote: "I have not failed. I've just found 10,000 ways that won't work."
  author: "Thomas A. Edison"
- quote: "It is never too late to be what you might have been."
  author: "George Eliot"
- quote: "Life isn't about finding yourself. Life is about creating yourself."
  author: "George Bernard Shaw"
- quote: "And, when you want something, all the universe conspires in helping you to achieve it."
  author: "Paulo Coelho"
  source: "The Alchemist"
- quote: "The brain is like a muscle. When it is in use we feel very good. Understanding is joyous."
  author: "Carl Sagan"
- quote: "We cannot solve problems with the same thinking we used to create them."
  author: "Albert Einstein"
